<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home Page</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; background: #f5f7fa; color: #222; }
  header { background: #2b6cb0; color: #fff; padding: 20px; text-align: center; }
  main { max-width: 640px; margin: 24px auto; padding: 0 16px; }
  .card { background: #fff; border-radius: 10px; padding: 20px; box-shadow: 0 1px 4px rgba(0,0,0,.1); }
  #status { margin-top: 16px; padding: 12px; border-radius: 8px; font-size: 15px; display: none; }
  .ok { background: #e6f6ea; color: #1d6b32; }
  .warn { background: #fff4e0; color: #8a5a00; }
  button { margin-top: 10px; padding: 8px 14px; border: 0; border-radius: 6px; background: #2b6cb0; color: #fff; cursor: pointer; }
  a.admin { display: block; text-align: center; margin: 24px 0; font-size: 14px; color: #666; }
</style>
</head>
<body>
<header><h1>Welcome!</h1></header>
<main>
  <div class="card">
    <p>This is our home page. You can view the entire site whether you allow or deny location access.</p>
    <p>Your location is stored only for testing purposes.</p>
    <div id="status"></div>
  </div>
  <a class="admin" href="/admin">Admin Panel</a>
</main>

<script>
const statusBox = document.getElementById("status");

function show(msg, cls, withRetry) {
  statusBox.className = cls;
  statusBox.style.display = "block";
  statusBox.innerHTML = msg +
    (withRetry ? '<br><button onclick="askLocation()">Try again</button>' : "");
}

function askLocation() {
  if (!("geolocation" in navigator)) {
    show("Your browser does not support location access.", "warn");
    return;
  }
  navigator.geolocation.getCurrentPosition(
    async (pos) => {
      const { latitude, longitude, accuracy } = pos.coords;
      try {
        const res = await fetch("/api/location", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ latitude, longitude, accuracy })
        });
        if (!res.ok) throw new Error();
        show("Thank you! Your location has been saved.", "ok");
      } catch (e) {
        show("Your location could not be saved.", "warn", true);
      }
    },
    (err) => {
      if (err.code === 1) {
        show("You denied location permission. That's okay — you can still use the site.", "warn", true);
      } else {
        show("Location could not be retrieved.", "warn", true);
      }
    },
    { enableHighAccuracy: true, timeout: 15000 }
  );
}

// Request permission after the page loads
window.addEventListener("load", askLocation);
</script>
</body>
</html>
