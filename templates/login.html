<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>অ্যাডমিন লগইন</title>
<style>
  body { font-family: system-ui, sans-serif; background: #f5f7fa; display: flex; justify-content: center; padding-top: 80px; }
  form { background: #fff; padding: 24px; border-radius: 10px; box-shadow: 0 1px 4px rgba(0,0,0,.1); width: 280px; }
  input { width: 100%; padding: 9px; margin: 6px 0 12px; box-sizing: border-box; }
  button { width: 100%; padding: 10px; border: 0; background: #2b6cb0; color: #fff; border-radius: 6px; cursor: pointer; }
  .err { color: #b00020; margin-bottom: 10px; }
</style>
</head>
<body>
<form method="post">
  <h2>অ্যাডমিন লগইন</h2>
  {% if error %}<div class="err">{{ error }}</div>{% endif %}
  <label>ইউজারনেম</label>
  <input name="username" required>
  <label>পাসওয়ার্ড</label>
  <input name="password" type="password" required>
  <button type="submit">লগইন</button>
</form>
</body>
</html>
