<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <style>
        body{font-family:Arial,sans-serif;background:#f4f7fb;display:grid;place-items:center;min-height:100vh;margin:0}.card{background:#fff;padding:30px;border-radius:16px;width:min(90%,360px);box-shadow:0 10px 30px #0001}input,button{width:100%;box-sizing:border-box;padding:12px;margin-top:10px;border-radius:8px;border:1px solid #ddd}button{cursor:pointer;background:#111;color:#fff}.error{color:#b00020}
    </style>
</head>
<body>
<div class="card">
    <h1>Admin Login</h1>
    {% with messages = get_flashed_messages() %}
        {% for message in messages %}<p class="error">{{ message }}</p>{% endfor %}
    {% endwith %}
    <form method="POST">
        <input name="username" placeholder="Username" autocomplete="username" required>
        <input name="password" type="password" placeholder="Password" autocomplete="current-password" required>
        <button type="submit">Login</button>
    </form>
</div>
</body>
</html>
