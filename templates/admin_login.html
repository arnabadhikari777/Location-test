<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>অ্যাডমিন লগইন</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='admin.css') }}">
</head>
<body class="login-page">
<div class="login-card">
    <h1>অ্যাডমিন লগইন</h1>
    {% for message in get_flashed_messages() %}<p class="error">{{ message }}</p>{% endfor %}
    <form method="post">
        <input name="username" placeholder="ইউজারনেম" autocomplete="username" autofocus required>
        <input name="password" type="password" placeholder="পাসওয়ার্ড" autocomplete="current-password" required>
        <button type="submit">লগইন</button>
    </form>
</div>
</body>
</html>
